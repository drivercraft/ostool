name: Quality Check

on:
  workflow_call:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      OSTOOL_TEST_DATABASE_URL: postgres://ostool:ostool@127.0.0.1:5432/ostool_e2e_local
      RUST_TEST_THREADS: 4
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ostool
          POSTGRES_PASSWORD: ostool
          POSTGRES_DB: ostool_e2e_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ostool -d ostool_e2e_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        rust-toolchain: [stable]
        targets: [x86_64-unknown-linux-gnu]
        
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: pnpm/action-setup@v5.0.0
      with:
        version: 10.33.0
        run_install: false
    - uses: actions/setup-node@v6.3.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: ostool-server/webui/pnpm-lock.yaml
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust-toolchain }}
        components: clippy, rustfmt, llvm-tools
        targets: ${{ matrix.targets }}
    - uses: Swatinem/rust-cache@v2.9.1
    - name: Install cargo-binutils for comparison tests
      run: cargo install cargo-binutils
    - name: Install qemu
      run: |
        sudo apt-get update
        sudo apt install qemu-system-aarch64 -y
        sudo apt install u-boot-tools -y
    - name: Install lib libudev-dev
      run: sudo apt install libudev-dev -y
    - name: Check rust version
      run: rustc --version --verbose
    - name: Check code format
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --target ${{ matrix.targets }} --all-features
    - name: Build
      run: cargo build --target ${{ matrix.targets }} --all-features
    - name: Unit test
      if: ${{ matrix.targets == 'x86_64-unknown-linux-gnu' }}
      run: cargo test --target ${{ matrix.targets }} -- --nocapture
    - name: Web UI unit tests
      run: |
        pnpm --dir ostool-server/webui install --frozen-lockfile
        pnpm --dir ostool-server/webui test
        pnpm --dir ostool-server/webui build
    - name: Server PostgreSQL integration and offline migration
      env:
        OSTOOL_TEST_DATABASE_URL: postgres://ostool:ostool@127.0.0.1:5432/ostool_e2e_local
      run: cargo test -p ostool-server --target ${{ matrix.targets }} --test security_postgres --test auth_postgres --test account_postgres --test audit_postgres --test unified_persistence --test board_migration -- --ignored
    - name: Install browser for admin integration tests
      run: pnpm --dir ostool-server/webui exec playwright install --with-deps chromium
    - name: Web UI integration tests
      env:
        OSTOOL_TEST_SERVER_BIN: ${{ github.workspace }}/target/${{ matrix.targets }}/debug/ostool-server
        OSTOOL_E2E_LOCAL_DATABASE_URL: postgres://ostool:ostool@127.0.0.1:5432/ostool_e2e_local
        OSTOOL_E2E_PUBLIC: "true"
      run: pnpm --dir ostool-server/webui test:e2e
    - name: Publish dry run
      run: cargo publish --workspace --dry-run --locked
