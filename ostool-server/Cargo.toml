[package]
authors = ["周睿 <zrufo747@outlook.com>"]
build = "build.rs"
categories = ["command-line-utilities", "embedded", "development-tools"]
description = "Server for managing development boards, serial sessions, and TFTP artifacts"
edition = "2024"
keywords = ["embedded", "u-boot", "tftp", "serial", "server"]
license = "MIT OR Apache-2.0"
name = "ostool-server"
default-run = "ostool-server"
readme = "README.md"
repository = "https://github.com/drivercraft/ostool"
version = "0.9.1"

exclude = ["webui/node_modules/*", "webui/dist/*", "webui/test-results/*", "webui/playwright-report/*"]

[package.metadata.binstall]
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ version }-{ target }.{ archive-format }"

[[bin]]
name = "ostool-server"
path = "src/main.rs"

[[bin]]
name = "ostool-server-migrate-boards"
path = "tools/migrate-boards.rs"

[[bin]]
name = "ostool-server-seed-demo"
path = "tools/seed-demo.rs"

[dependencies]
unicode-normalization = "0.1"
uboot-shell = { version = "0.2.9", path = "../uboot-shell" }
tokio-util = { version = "0.7", features = ["compat"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "script", "tls-rustls-webpki-roots"] }
captcha = { version = "1.0", default-features = false }
ring = "0.17"
subtle = "2.6"
data-encoding = "2.9"
ipnet = { version = "2", features = ["serde"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls", "ring", "webpki-roots"] }
anyhow = {workspace = true}
async-trait = "0.1"
axum = {version = "0.8", features = ["ws"]}
argon2 = "0.5"
base64 = "0.22"
chrono = {version = "0.4.44", features = ["serde"]}
clap = {workspace = true, features = ["derive"]}
env_logger = {workspace = true}
dotenvy = "0.15"
futures-util = "0.3"
fs4 = "1.1"
tempfile = "3"
httpboot-protocol = { workspace = true }
ostool-serial = { workspace = true }
log = {workspace = true}
mime_guess = "2"
network-interface = "2"
nusb = "0.2.3"
rust-embed = {version = "8", features = ["interpolate-folder-path", "debug-embed"]}
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rand = "0.9"
schemars = {workspace = true, features = ["derive"]}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
serialport = "4.6"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tftpd = "0.5"
thiserror = {workspace = true}
tokio = {workspace = true, features = ["full"]}
tokio-modbus = {version = "0.17.0", default-features = false, features = ["rtu"]}
tokio-serial = "5.4"
toml = {workspace = true}
tower-http = {version = "0.6", features = ["fs"]}
url = {workspace = true}
uuid = {version = "1", features = ["serde", "v4"]}

[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys = "0.8"
notify = "8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
ostool = { version = "0.31.1", path = "../ostool" }
nix = {version="0.30", features=["term"]}
tokio-modbus = {version = "0.17.0", default-features = false, features = ["rtu", "rtu-server"]}
tokio-tungstenite = "0.28"
tower = {version = "0.5", features = ["util"]}
