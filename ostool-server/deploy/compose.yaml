# 本机与服务器运行相同的 release 镜像；仅地址、证书和密钥等环境配置不同。
services:
  server:
    image: ostool-server:release
    build:
      context: ../..
      dockerfile: ostool-server/deploy/Dockerfile
    env_file:
      - path: ${OSTOOL_ENV_FILE:-../.env}
        required: false
    environment:
      OSTOOL_DATA_DIR: /var/lib/ostool-server
    volumes:
      - server-data:/var/lib/ostool-server
    # 与 systemd 部署使用相同的回环 API 和主机网络，不需要代理 IP 推断。
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent "http://$$OSTOOL_LISTEN_ADDR/api/v1/auth/config"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ostool
      POSTGRES_PASSWORD: ${OSTOOL_POSTGRES_PASSWORD:?请在 .env 中设置数据库密码}
      POSTGRES_DB: ostool
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${OSTOOL_POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ostool -d ostool']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${OSTOOL_REDIS_PORT:-56380}:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 仅 dev.sh 显式选择此 profile；正式部署继续使用已有的共享 Caddy。
  caddy:
    image: caddy:2-alpine
    profiles: [gateway]
    environment:
      OSTOOL_GATEWAY_SITES: ${OSTOOL_GATEWAY_SITES:-https://localhost}
      OSTOOL_GATEWAY_UPSTREAM: ${OSTOOL_GATEWAY_UPSTREAM:-127.0.0.1:2999}
    volumes:
      - ./gateway.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    network_mode: host
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  server-data:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
