[package]
name = "ostool-serial"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "On-demand serial discovery and ownership for axloader sessions"
repository = "https://github.com/drivercraft/ostool"

[dependencies]
httpboot-protocol.workspace = true
tokio.workspace = true
serialport = "4.6"
tokio-serial = "5.4"
futures-util = "0.3"
thiserror.workspace = true
log.workspace = true
serde.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["term", "fs"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
